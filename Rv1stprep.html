            border: 0;
            border-radius: 14px;
            padding: 14px;
            background: var(--pr);
            color: #fff;
            width: 100%;
            margin: 6px 0;
            font-weight: 700;
            font-size: 16px;

        button:active { transform: scale(0.98); }
        button.o {
            background: #f8fafc;
            color: var(--tx);
            border: 2px solid var(--border);
            text-align: left;
            direction: ltr;
            font-weight: 600;
            box-shadow: none;
        }
        button.o:hover { border-color: var(--pr); background: #f0f9ff; }
        button.ok { background: var(--ok) !important; color: #fff; border-color: var(--ok) !important; }
        button.no { background: var(--no) !important; color: #fff; border-color: var(--no) !important; }

        .g button { margin: 0; padding: 16px 8px; font-size: 15px; }
        .q { font-size: 19px; direction: ltr; text-align: left; margin: 14px 0; line-height: 1.5; font-weight: 700; color: #0f172a; word-break: break-word; }

        .top { display: flex; justify-content: space-between; color: var(--mu); font-size: 14px; font-weight: 700; margin-bottom: 6px; }

            font: inherit;
            width: 100%;

            border-radius: 14px;
            border: 2px solid var(--border);
            direction: ltr;
            background: #f8fafc;
            color: var(--tx);
            outline: none;
            font-weight: 600;
            font-size: 16px;

        input:focus { border-color: var(--pr); background: #fff; }

        .link { background: none; color: var(--mu); font-size: 14px; box-shadow: none; font-weight: 600; }

            "mistake,hard,for,at,lab|hard,mistake,lab,for|Omar had a science exam this week, and he was nervous. He studied {1} every night and wrote notes to help him. At first, he made a {2}, but his teacher explained the idea again. Omar visited the school {3} to do the experiment himself. Later, he found a smart solution online. He wants to be successful, so he always tries to revise {4} tests early.",
            "doing,making,with,confident,benefit|benefit,confident,doing,with|Learning with others can be exciting! In group learning, you often enjoy working on fun tasks. One {1} is that you get to share opinions and hear new ideas. You may feel more {2} when you work in a team. I once watched a program on TV showing kids {3} a school project together. They looked so happy and creative. They really knew how to communicate {4} each other.",
            "focus,regularly,goal,cooperation,distraction|distraction,focus,regularly,goal|Sara wanted to study, but there was too much {1} at home. Her baby brother was crying loudly. She went to another room to {2} better. She also found a great memory technique on a school website. Now she studies {3}, even on weekends. She helps her friend get ready for English tests. Her {4} is to be one of the top students in her class."
        ];

        const MC = MC_raw.map(l => { let parts = l.split("#"); return { q: parts[0], o: parts[1].split("/"), a: +parts[2] }; });
        const GR = GR_raw.map(l => { let parts = l.split("#"); return { q: parts[0], a: parts[1] }; });
        const FI = FI_raw.map(l => { let parts = l.split("|"); return { w: parts[0].split(","), a: parts[1].split(","), t: parts[2] }; });

        const ch = (a, n) => { let r = []; for (let i = 0; i < a.length; i += n) r.push(a.slice(i, i + n)); return r; };
        const G = { mc: ch(MC, 20), gr: ch(GR, 20), fi: ch(FI, 5) };
        const norm = s => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/\b(can't|cannot)\b/g, "can not").replace(/n't\b/g, " not").replace(/\bi'm\b/g, "i am").replace(/\b(it|he|she|that)'s\b/g, "$1 is").replace(/[^a-z0-9' ]/g, " ").replace(/\s+/g, " ").trim();
        const $ = document.getElementById("app");
        let S = {};
        let NAME = "";

        function welcome() {
            $.innerHTML = 
                '<div class="welcome-card">' +
                    '<div class="ayah">إن الله وملائكته يصلون على النبي يا أيها الذين آمنوا صلوا عليه وسلموا تسليما</div>' +
                    '<div class="teacher-name">Mr Mohamed Elshahawy</div>' +
                    '<div class="teacher-phone">01277924562</div>' +
                '</div>' +
                '<p class="s" style="font-size:16px;color:var(--tx); margin-top:16px;">أهلاً بك يا بطل! اكتب اسمك للبدء:</p>' +
                '<input id="nm" class="nm" placeholder="اكتب اسمك هنا..." autocomplete="off">' +
                '<div style="text-align:center"><button style="width:auto;padding:12px 40px;margin-top:14px" onclick="go()">ابدأ الآن 🚀</button></div>';
        }

        function go() {
            let v = document.getElementById("nm").value.trim();
            if (!v) {
                document.getElementById("nm").style.borderColor = "var(--no)";
                return;
            }
            NAME = v;
            home();
        }

        function home() {
            if (!NAME) return welcome();
            $.innerHTML = 
                '<h1>🎮 Prep 1 - Units 1 & 2</h1>' +
                '<p class="s">اختر نوع التحدي للبدء</p>' +
                '<div class="card"><h3>🔤 تحديات الكلمات</h3><p class="s">Choose the correct answer</p>' + grid("mc") + '</div>' +
                '<div class="card"><h3>✏️ تحديات القواعد</h3><p class="s">Rewrite the sentences</p>' + grid("gr") + '</div>' +
                '<div class="card"><h3>🧩 أكمل القطعة</h3><p class="s">Complete the text with the words</p>' + grid("fi") + '</div>';
        }

        function grid(t) {
            return '<div class="g">' + G[t].map((g, i) => '<button onclick="start(\'' + t + '\', ' + i + ')">جروب ' + (i + 1) + '<br><small style="color:#0369a1; font-weight:700;">' + g.length + ' ' + (t == "fi" ? "قطع" : "سؤال") + '</small></button>').join("") + '</div>';
        }

        function start(t, i) {
            let g = G[t][i];
            S = { t: t, i: i, qs: g, n: 0, sc: 0, done: false, max: t == "fi" ? g.length * 4 : g.length };
            show();
        }

        function head() {
            return '<div class="top"><span>' + (S.t == "fi" ? "قطعة" : "سؤال") + ' ' + (S.n + 1) + '/' + S.qs.length + '</span><span>⭐ ' + S.sc + '</span></div><div class="bar"><i style="width:' + (S.n / S.qs.length * 100) + '%"></i></div>';
        }

        function show() {
            if (S.t == "fi") return showFi();
            let q = S.qs[S.n];
            let h = head() + '<div class="card"><div class="q">' + q.q.replace("___", "<b>_____</b>") + '</div>';
            if (S.t == "mc") {
                for (let i = 0; i < q.o.length; i++) {
                    h += '<button class="o" onclick="pick(' + i + ')">' + "abcd"[i] + '. ' + q.o[i] + '</button>';
                }
            } else {
                h += '<p class="s" style="margin:0 0 8px">أعد كتابة الجملة باستخدام الكلمة اللي بين الأقواس</p><input id="in" autocomplete="off" autocapitalize="off" placeholder="Type your sentence"><button onclick="chk()">تأكيد ✔️</button>';
            }
            $.innerHTML = h + '<div id="fb" class="fb"></div></div>';
            let e = document.getElementById("in");
            if (e) e.onkeydown = k => { if (k.key == "Enter") chk(); };
        }

        function showFi() {
            let q = S.qs[S.n];
            if (!S.pl) { S.pl = [null, null, null, null]; S.sel = null; }
            let tx = q.t.split(/\{(\d)\}/).map((p, i) => {
                if (i % 2 == 0) return p;
                let k = p - 1, w = S.pl[k], c = S.done ? (w == q.a[k] ? "ok" : "no") : "";
                return '<span class="bl ' + c + '" ondragover="event.preventDefault()" ondrop="drp(event,' + k + ')" onclick="bl(' + k + ')">' + (w || '(' + p + ' ......)') + '</span>';
            }).join("");
            
            let bank = S.done ? "" : q.w.filter(w => !S.pl.includes(w)).map(w => '<span class="tl' + (S.sel == w ? " sel" : "") + '" draggable="true" ondragstart="event.dataTransfer.setData(\'text\',\'' + w + '\')" onclick="sw(\'' + w + '\')">' + w + '</span>').join("");
            
            let fb = "";
            if (S.done) {
                let c = S.pl.filter((w, k) => w == q.a[k]).length;
                fb = '<div class="fb">' + c + '/4 ✅</div>' + (c < 4 ? '<div class="fb" dir="ltr">' + q.a.map((w, k) => (k + 1) + "." + w).join("  ") + '</div>' : '') + '<button style="margin-top:10px;" onclick="nxt()">السؤال التالي ➡️</button>';
            } else {
                fb = '<button onclick="chkFi()">تأكيد ✔️</button>';
            }
            
            $.innerHTML = head() + '<div class="card"><p class="s">اضغط على الكلمة ثم اضغط مكانها في القطعة (أو اسحبها)</p><div class="pool" style="justify-content:center">' + bank + '</div><div class="pas">' + tx + '</div>' + fb + '</div>';
        }

        function sw(w) { S.sel = S.sel == w ? null : w; showFi(); }
        function put(k, w) { S.pl = S.pl.map(x => x == w ? null : x); S.pl[k] = w; S.sel = null; showFi(); }
        function bl(k) { if (S.done) return; if (S.sel) put(k, S.sel); else { S.pl[k] = null; showFi(); } }
        function drp(e, k) { e.preventDefault(); if (!S.done) put(k, e.dataTransfer.getData('text')); }
        function chkFi() {
            if (S.done) return;
            let q = S.qs[S.n];
            S.sc += S.pl.filter((w, k) => w == q.a[k]).length;
            S.done = true;
            showFi();
        }

        function fin(ok, ans) {
            if (S.done) return;
            S.done = true;
            if (ok) S.sc++;
            let msg = ok ? '<span style="color:var(--ok)">✅ بطل ممتاز! إجابة صحيحة</span>' : '<span style="color:var(--no)">❌ خطأ — الإجابة: <b dir="ltr">' + ans + '</b></span>';
            document.getElementById("fb").innerHTML = msg + '<button style="margin-top:10px;" onclick="nxt()">السؤال التالي ➡️</button>';
        }

        function pick(i) {
            if (S.done) return;
            let q = S.qs[S.n];
            let btns = document.querySelectorAll(".o");
            for (let j = 0; j < btns.length; j++) {
                if (j == q.a) btns[j].classList.add("ok");
                else if (j == i) btns[j].classList.add("no");
            }
            fin(i == q.a, q.o[q.a]);
        }

        function chk() {
            if (S.done) return;
            let q = S.qs[S.n], v = document.getElementById("in");
            let ok = q.a.split("|").some(x => norm(x) == norm(v.value));
            v.style.borderColor = ok ? "var(--ok)" : "var(--no)";
            v.disabled = true;
            fin(ok, q.a.split("|")[0]);
        }

        function nxt() {
            S.done = false; S.pl = null; S.n++;
            if (S.n < S.qs.length) show();
            else end();
        }

        function end() {
            let pc = Math.round(S.sc / (S.max || S.qs.length) * 100);
            let tpNames = { mc: "Word Challenges", gr: "Rewrite Challenges", fi: "Complete the Text" };
            let tp = tpNames[S.t] + " - Group " + (S.i + 1);
            let msg = pc >= 90 ? "أنت بطل خارق! 🏆" : pc >= 60 ? "ممتاز جداً! 👏" : "حاول مرة أخرى، يمكنك الإبضاع! 📚";
            let waText = "Prep 1 - Units 1 & 2 Revision\nName: " + NAME + "\nTopic: " + tp + "\nScore: " + S.sc + "/" + (S.max || S.qs.length) + " (" + pc + "%)";
            let wa = "https://wa.me/201277924562?text=" + encodeURIComponent(waText);
            
            $.innerHTML = 
                '<div class="card gold">' +
                    '<div class="sc">' + S.sc + '/' + (S.max || S.qs.length) + '</div>' +
                    '<h3 style="font-size:20px; color:#d97706;">' + pc + '% — ' + msg + '</h3>' +
                    '<p class="s">' + NAME + '<br>' + tp + '</p>' +
                '</div>' +
                '<a class="wa" href="' + wa + '" target="_blank" rel="noopener">📲 مشاركة النتيجة عبر واتساب</a>' +
                '<button onclick="start(\'' + S.t + '\', ' + S.i + ')">🔁 حاول مرة أخرى</button>' +
                '<button class="link" onclick="home()">اختر موضوعاً آخر</button>';
        }

        welcome();
    </script>
</body>
</html>
