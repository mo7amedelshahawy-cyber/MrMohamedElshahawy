<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Prep 2 Review - Mr Mohamed Elshahawy</title>
    <style>
        :root {
            --bg: #f0fdf4;
            --card: #ffffff;
            --tx: #1e293b;
            --mu: #64748b;
            --pr: #0284c7;
            --pr-hover: #0369a1;
            --ok: #16a34a;
            --no: #dc2626;
            --gold: #d97706;
            --border: #cbd5e1;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            width: 100%;
            max-width: 480px;
            margin: auto;
            padding: 12px;
        }
        h1 { font-size: 22px; text-align: center; margin: 8px 0; font-weight: 800; color: #0284c7; }
        p.s { text-align: center; color: var(--mu); margin: 0 0 16px; font-size: 15px; font-weight: 600; }
        
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 18px 14px;
            margin: 12px 0;
            box-shadow: 0 8px 20px -4px rgba(14, 165, 233, 0.12);
            border: 2px solid #e0f2fe;
        }

        .welcome-card {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            text-align: center;
            border-radius: 20px;
            padding: 22px 16px;
            margin: 12px 0;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.25);
            border: none;
        }
        .welcome-card .ayah {
            font-size: 15px;
            line-height: 2.2;
            font-family: "Traditional Arabic", "Amiri", serif;
            color: #fef08a;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .teacher-name {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 0.5px;
            margin: 8px 0 4px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
        }
        .teacher-phone {
            font-size: 22px;
            font-weight: 800;
            direction: ltr;
            letter-spacing: 1.5px;
            color: #86efac;
            background: rgba(0, 0, 0, 0.2);
            display: inline-block;
            padding: 4px 16px;
            border-radius: 30px;
            margin-top: 6px;
        }

        button {
            font: inherit;
            cursor: pointer;
            border: 0;
            border-radius: 14px;
            padding: 14px;
            background: var(--pr);
            color: #fff;
            width: 100%;
            margin: 6px 0;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }
        button:active { transform: scale(0.98); }
        button.o {
            background: #f8fafc;
            color: var(--tx);
            border: 2px solid var(--border);
            text-align: left;
            direction: ltr;
            font-weight: 600;
            box-shadow: none;
        }
        button.o:hover { border-color: var(--pr); background: #f0f9ff; }
        button.ok { background: var(--ok) !important; color: #fff; border-color: var(--ok) !important; }
        button.no { background: var(--no) !important; color: #fff; border-color: var(--no) !important; }
        
        .g { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .g button { margin: 0; padding: 16px 8px; font-size: 15px; }
        .q { font-size: 19px; direction: ltr; text-align: left; margin: 14px 0; line-height: 1.5; font-weight: 700; color: #0f172a; word-break: break-word; }
        
        .bar { height: 10px; background: #e2e8f0; border-radius: 8px; overflow: hidden; margin-top: 6px; }
        .bar i { display: block; height: 100%; background: linear-gradient(90deg, #38bdf8, #0284c7); border-radius: 8px; }
        .top { display: flex; justify-content: space-between; color: var(--mu); font-size: 14px; font-weight: 700; margin-bottom: 6px; }
        
        input {
            font: inherit;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 2px solid var(--border);
            direction: ltr;
            background: #f8fafc;
            color: var(--tx);
            outline: none;
            font-weight: 600;
            font-size: 16px;
        }
        input:focus { border-color: var(--pr); background: #fff; }
        
        .fb { margin-top: 12px; font-weight: 700; text-align: center; font-size: 16px; }
        .link { background: none; color: var(--mu); font-size: 14px; box-shadow: none; font-weight: 600; }
        
        .hd {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff;
            font-weight: 800;
            font-size: 17px;
            padding: 16px;
            margin: -12px -12px 16px;
            direction: ltr;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
            text-align: center;
        }
        .gold { border: 3px solid #fde68a; text-align: center; background: linear-gradient(180deg, #fffbeb 0%, #ffffff 100%); }
        
        .wa {
            display: block;
            text-align: center;
            text-decoration: none;
            background: #16a34a;
            color: #fff;
            border-radius: 14px;
            padding: 15px;
            margin: 12px 0;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3);
        }
        .sc { font-size: 50px; font-weight: 900; color: #d97706; margin: 8px 0; }
        input.nm { text-align: center; font-size: 18px; }
        
        .ans { min-height: 56px; border: 2px dashed #cbd5e1; border-radius: 14px; padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; direction: ltr; margin-bottom: 14px; background: #f8fafc; }
        .pool { display: flex; flex-wrap: wrap; gap: 6px; direction: ltr; margin-bottom: 10px; }
        .tl { background: #0284c7; color: #fff; border-radius: 10px; padding: 8px 14px; font-size: 15px; cursor: pointer; font-weight: 700; }
        .pas { direction: ltr; text-align: left; font-size: 17px; line-height: 2.2; margin: 12px 0; }
        .bl { display: inline-block; min-width: 90px; text-align: center; border-bottom: 2px dashed var(--gold); color: var(--gold); font-weight: 700; cursor: pointer; padding: 0 6px; }
        .bl.ok { color: var(--ok); }
        .bl.no { color: var(--no); }
        .sel { outline: 3px solid var(--gold); }
    </style>
</head>
<body>
    <div class="hd">Prep 2 - Units 1 to 3 Review</div>
    <div id="app"></div>
    <script>
        const MC1_raw = [
            "The time people spend using a screen is called ___.#spare time/free time/screen time/waste time#2",
            "We should all treat old people ___ kindness.#to/for/with/in#2",
            "___ are small digital images used to express emotions or ideas in electronic messages.#Sites/Websites/Emojis/Photos#2",
            "Many parents encourage their children to use ___ skills online.#digital/interpersonal/manual/mechanical#0",
            "Gen Alpha is a generation that is hoped to ___ the future.#ship/shape/tape/tip#1",
            "Gen Alpha learn to use ___ before they can read.#apps/tablets/computers/phones#1",
            "Gen Alpha share ___ and use emojis to express feelings.#photos/pages/memes/notes#2",
            "A group of people born around the same time are called ___.#generation/preparation/connection/presentation#0",
            "The antonym of the word 'encourage' is ___.#uncourage/discourage/support/motivate#1",
            "'___' means being in distant places.#Near/Open/Far apart/A part#2",
            "Last year, my father's facebook account was ___ as his password was very simple.#hacked/healed/hooked/hoped#0",

            "Don't put yourself ___ risk by trying extreme sports.#in/at/on/of#1",

            "The clues you leave behind when using social media make up your digital ___.#footprints/fingerprints/printers/notes#0",
            "The antonym of the word 'careful' is ___.#careless/cautious/weak/strong#0"

        const MC2_raw = [
            "To protect your online accounts, you need a strong ___.#effect/password/information/data#1",
            "___ old stamps is one of my favorite hobbies.#Connecting/Cancelling/Collecting/Communicating#2",
            "To stay safe online, we shouldn't ___ our personal data.#delete/save/remove/share#3",

            "The antonym of the word 'courage' is '___'.#strength/power/fear/bravery#2",
            "Leila felt ___ when she lost the race.#disappoint/disappointed/disappoints/disappointing#1",
            "A ___ is a difficult situation or task.#quiz/result/step/challenge#3",
            "She is trying to ___ the challenges in her new job.#make/fail/give up/overcome#3",
            "You should have ___ to overcome your challenges.#fear/anger/determination/laziness#2",
            "A traffic jam happens when long lines of cars can't move or are moving very ___.#fast/quickly/slow/slowly#3",
            "The word 'hard' is a synonym for '___'.#easy/simple/difficult/brave#2",
            "Every day in Cairo, there are big traffic ___ on streets and highways.#signs/jams/jars/roads#1",
            "When many people drive cars, roads get ___.#better/faster/blocked/open#2",
            "In big cities, it's easier to ___ using buses, bikes, or trains.#stay/move around/fly/play#1",
            "The words 'blocked' and 'open' are ___.#antonyms/synonyms/meanings/the same#0",
            "He felt ___ when he got low marks in his exams.#pleased/happy/brave/disappointed#3",
            "The prefix ___ gives the opposite of the word 'afraid'.#in/un/il/dis#1"
        ];

        const GR_raw = [
            "My mom always cleans our rooms on Friday. (now)#My mom is cleaning our rooms now.",
            "I have booked the tickets to travel next week. (traveling)#I am traveling next week.",
            "Ali does his homework every day. (at the moment)#Ali is doing his homework at the moment.",
            "Students read in the library. (Look)#Look! The students are reading in the library.|Look! Students are reading in the library.",
            "They have arranged to volunteer in protecting the environment. (are)#They are volunteering in protecting the environment.",
            "He has booked a ticket to watch a play next week. (watching)#He is watching a play next week.",
            "She writes her project plan. (now)#She is writing her project plan now.",
            "Nadia volunteers to help her neighbors. (is)#Nadia is volunteering to help her neighbors.",
            "The students study for the coming English exam. (at this moment)#The students are studying for the coming English exam at this moment.",
            "The children sing in their room. (Listen)#Listen! The children are singing in their room.",
            "My sister plays online games with her brother. (is)#My sister is playing online games with her brother.",
            "We watch a match in Cairo Stadium. (next Friday)#We are watching a match in Cairo Stadium next Friday.",
            "My brother cleans his room every Friday. (now)#My brother is cleaning his room now.",
            "I do my homework in the evening. (at the moment)#I am doing my homework at the moment.",
            "My brother has arranged to travel next Friday. (traveling)#My brother is traveling next Friday.",
            "I have a plan to buy a new mobile next month. (I am)#I am buying a new mobile next month.",
            "Many companies make cars in Japan. (are made)#Cars are made in Japan by many companies.|Cars are made by many companies in Japan.",
            "Our uniforms are ironed every week. (Our mom)#Our mom irons our uniforms every week.",
            "We should obey our traffic rules. (be)#Our traffic rules should be obeyed.|Our traffic rules should be obeyed by us.",
            "English is spoken in many parts of the world. (Many people)#Many people speak English in many parts of the world.",
            "My mother cleans our apartment every day. (is)#Our apartment is cleaned by my mother every day.|Our apartment is cleaned every day by my mother.",
            "Egypt exports a lot of products to many countries. (exported)#A lot of products are exported to many countries by Egypt.|A lot of products are exported from Egypt to many countries.",
            "Teachers in our schools use the latest technology inside the classes. (used)#The latest technology is used inside the classes by teachers in our schools.|The latest technology is used by teachers in our schools inside the classes.",
            "If water is boiled, it turns into vapor. (If we.....)#If we boil water, it turns into vapor.",
            "Teachers explain their lessons using smartboards. (are)#Lessons are explained using smartboards.|Their lessons are explained using smartboards by teachers.|Lessons are explained by teachers using smartboards.",
            "We should follow the traffic rules. (be)#The traffic rules should be followed.|The traffic rules should be followed by us.",
            "It is important to get up early. (should)#We should get up early.|You should get up early.",
            "A lot of videos are downloaded from the internet. (People)#People download a lot of videos from the internet.",
            "We use the Metro to go to and from our work. (is)#The Metro is used to go to and from our work.|The Metro is used by us to go to and from our work.",
            "Teachers reward good students for their work. (are)#Good students are rewarded for their work.|Good students are rewarded by teachers for their work.",
            "Students should keep their school clean. (be)#Their school should be kept clean.|The school should be kept clean.|Their school should be kept clean by students.",
            "You should go to school early. (important)#It is important to go to school early.",
            "A lot of messages are sent on the internet. (People)#People send a lot of messages on the internet.",
            "We use cameras to take photos. (are)#Cameras are used to take photos.|Cameras are used by us to take photos.",
            "Teachers help students understand their lessons. (are)#Students are helped to understand their lessons.|Students are helped to understand their lessons by teachers.",
            "We should give a hand to the poor. (be)#The poor should be given a hand.|A hand should be given to the poor.",
            "It's important to eat healthy food. (should)#We should eat healthy food.|You should eat healthy food.",
            "A lot of projects are done in Egypt. (The government)#The government does a lot of projects in Egypt.",
            "We produce different goods in our town. (are)#Different goods are produced in our town.|Different goods are produced in our town by us.",
            "It is important to make a study plan. (should)#We should make a study plan.|You should make a study plan.",
            "You should think twice before posting anything online. (carefully)#You should think carefully before posting anything online.",
            "Amira uses a strong password to protect her account. (is)#A strong password is used to protect her account.|A strong password is used by Amira to protect her account.|A strong password is used to protect her account by Amira.",
            "Football isn't played by us on Friday. (We)#We don't play football on Friday.",
            "My brother cleans his room every Friday. (His room..)#His room is cleaned by my brother every Friday.|His room is cleaned every Friday by my brother.",
            "Do people speak English in Egypt? (Is ...)#Is English spoken in Egypt?",
            "My brother played online yesterday. (yesterday's evening)#My brother played online yesterday evening.|My brother played online yesterday's evening.",
            "While I was going home, I met an old friend. (When)#When I was going home, I met an old friend.",
            "I was studying English when my father came home. (As)#As I was studying English, my father came home.|As I was studying English my father came home.",
            "While I was visiting Paris, I studied French. (During)#During my visit to Paris, I studied French.|During my stay in Paris, I studied French.|During my visit in Paris, I studied French.",
            "When the teacher entered the class, the students were doing a project. (While)#While the students were doing a project, the teacher entered the class.",
            "As we were riding bikes, Ali broke his leg. (When)#When we were riding bikes, Ali broke his leg.",
            "I fell asleep. I watched a movie. (While)#I fell asleep while I was watching a movie.|While I was watching a movie, I fell asleep.",
            "My mother made the salad. My father came. (When)#When my father came, my mother was making the salad.|My mother was making the salad when my father came.",
            "While I was walking to school, I saw an accident. (When)#When I was walking to school, I saw an accident.",
            "She had the ability to make her own food. (was)#She was able to make her own food.",
            "They were playing tennis when it started to rain. (While)#While they were playing tennis, it started to rain.",
            "They went to the park last week. (ago)#They went to the park a week ago."
        ];

        const FI_raw = [
            "memes,balance,represent,videos,photos|videos,memes,balance,represent|Gen Alpha are the children who were born from around 2010 to the mid-2020s. They like creating short {1} to show their hobbies and opinions. They share {2} and send emojis to show their emotions. They are learning to {3} online activities with real-life connections. They {4} a powerful trend that is shaping the future.",
            "language,understand,about,to,thoughts|about,thoughts,language,understand|Gen Z and Gen Alpha like short videos, emojis, and memes. Many of them care {1} the environment. They share their {2} through using technology. Both generations speak the same digital {3}. Technology helps them {4} each other and cooperate to make their world a better place.",
            "better,connect,common,language,connected|common,connect,language,better|Both Gen Z and Gen Alpha are today's young generations, growing up in a digital world. They have a lot in {1}, like using smartphones to watch videos and play games. Social media helps them {2}, even if they live far apart. Technology helps them speak the same digital {3} and understand each other. It also helps them share their ideas and work together to make the world a {4} place.",
            "passwords,updates,remove,trace,removal|updates,passwords,trace,remove|There are some important tips to follow to protect your privacy online. Think before you share photos or {1} online. You should change your {2} every now and then. Everything you do online leaves a {3}, like a footprint. This includes the websites you visit and the things you post. So, be careful about what you post as it can be hard to {4} later.",
            "obstacle,posters,challenges,improve,improved|challenges,posters,obstacle,improve|With determination, Soha started to work harder. She wanted to overcome her {1} with grammar. She watched videos and made grammar {2} for her room. Each grammar rule felt like an {3}, but she didn't stop. Slowly, she began to {4}. She passed her next quiz and felt proud of herself.",
            "blocked,dirty,jams,stressed,stress|jams,blocked,dirty,stressed|Cairo is a very busy city. Every day, we find traffic {1} on its streets and highways. People drive their cars and roads get {2}. This causes pollution, making the air {3}. It also makes people feel {4} and tired from waiting.",
            "proud,injured,solutions,determination,injury|injured,solutions,determination,proud|Our team faced a big challenge last week. When our best player was {1}, we needed to solve this problem before the final match. We looked for different {2} and changed our plan. With great {3}, we did our best and won the game. We were all very {4} of our teamwork."
        ];

        const MC1 = MC1_raw.map(l => { let parts = l.split("#"); return { q: parts[0], o: parts[1].split("/"), a: +parts[2] }; });
        const MC2 = MC2_raw.map(l => { let parts = l.split("#"); return { q: parts[0], o: parts[1].split("/"), a: +parts[2] }; });
        const GR = GR_raw.map(l => { let parts = l.split("#"); return { q: parts[0], a: parts[1] }; });
        const FI = FI_raw.map(l => { let parts = l.split("|"); return { w: parts[0].split(","), a: parts[1].split(","), t: parts[2] }; });

        const ch = (a, n) => { let r = []; for (let i = 0; i < a.length; i += n) r.push(a.slice(i, i + n)); return r; };
        const G = { mc: [MC1, MC2], gr: ch(GR, 19), fi: [FI] };
        const norm = s => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/\b(can't|cannot)\b/g, "can not").replace(/n't\b/g, " not").replace(/\bi'm\b/g, "i am").replace(/\b(it|he|she|that)'s\b/g, "$1 is").replace(/[^a-z0-9' ]/g, " ").replace(/\s+/g, " ").trim();
        const $ = document.getElementById("app");
        let S = {};
        let NAME = "";

        function welcome() {
            $.innerHTML = 
                '<div class="welcome-card">' +
                    '<div class="ayah">إن الله وملائكته يصلون على النبي يا أيها الذين آمنوا صلوا عليه وسلموا تسليما</div>' +
                    '<div class="teacher-name">Mr Mohamed Elshahawy</div>' +
                    '<div class="teacher-phone">01277924562</div>' +
                '</div>' +
                '<p class="s" style="font-size:16px;color:var(--tx); margin-top:16px;">أهلاً بك يا بطل! اكتب اسمك للبدء:</p>' +
                '<input id="nm" class="nm" placeholder="اكتب اسمك هنا..." autocomplete="off">' +
                '<div style="text-align:center"><button style="width:auto;padding:12px 40px;margin-top:14px" onclick="go()">ابدأ الآن 🚀</button></div>';
        }

        function go() {
            let v = document.getElementById("nm").value.trim();
            if (!v) {
                document.getElementById("nm").style.borderColor = "var(--no)";
                return;
            }
            NAME = v;
            home();
        }

        function home() {
            if (!NAME) return welcome();
            $.innerHTML = 
                '<h1>🎮 Prep 2 - Units 1 to 3</h1>' +
                '<p class="s">اختر نوع التحدي للبدء</p>' +
                '<div class="card"><h3>🔤 تحديات الكلمات</h3><p class="s">Choose the correct answer</p>' + grid("mc") + '</div>' +
                '<div class="card"><h3>✏️ تحديات القواعد</h3><p class="s">Rewrite the sentences</p>' + grid("gr") + '</div>' +
                '<div class="card"><h3>🧩 أكمل القطعة</h3><p class="s">Complete the text with the words</p>' + grid("fi") + '</div>';
        }

        function grid(t) {
            return '<div class="g">' + G[t].map((g, i) => '<button onclick="start(\'' + t + '\', ' + i + ')">جروب ' + (i + 1) + '<br><small style="color:#0369a1; font-weight:700;">' + g.length + ' ' + (t == "fi" ? "قطع" : "سؤال") + '</small></button>').join("") + '</div>';
        }

        function start(t, i) {
            let g = G[t][i];
            S = { t: t, i: i, qs: g, n: 0, sc: 0, done: false, max: t == "fi" ? g.length * 4 : g.length };
            show();
        }

        function head() {
            return '<div class="top"><span>' + (S.t == "fi" ? "قطعة" : "سؤال") + ' ' + (S.n + 1) + '/' + S.qs.length + '</span><span>⭐ ' + S.sc + '</span></div><div class="bar"><i style="width:' + (S.n / S.qs.length * 100) + '%"></i></div>';
        }

        function show() {
            if (S.t == "fi") return showFi();
            let q = S.qs[S.n];
            let h = head() + '<div class="card"><div class="q">' + q.q.replace("___", "<b>_____</b>") + '</div>';
            if (S.t == "mc") {
                for (let i = 0; i < q.o.length; i++) {
                    h += '<button class="o" onclick="pick(' + i + ')">' + "abcd"[i] + '. ' + q.o[i] + '</button>';
                }
            } else {
                h += '<p class="s" style="margin:0 0 8px">أعد كتابة الجملة باستخدام الكلمة اللي بين الأقواس</p><input id="in" autocomplete="off" autocapitalize="off" placeholder="Type your sentence"><button onclick="chk()">تأكيد ✔️</button>';
            }
            $.innerHTML = h + '<div id="fb" class="fb"></div></div>';
            let e = document.getElementById("in");
            if (e) e.onkeydown = k => { if (k.key == "Enter") chk(); };
        }

        function showFi() {
            let q = S.qs[S.n];
            if (!S.pl) { S.pl = [null, null, null, null]; S.sel = null; }
            let tx = q.t.split(/\{(\d)\}/).map((p, i) => {
                if (i % 2 == 0) return p;
                let k = p - 1, w = S.pl[k], c = S.done ? (w == q.a[k] ? "ok" : "no") : "";
                return '<span class="bl ' + c + '" ondragover="event.preventDefault()" ondrop="drp(event,' + k + ')" onclick="bl(' + k + ')">' + (w || '(' + p + ' ......)') + '</span>';
            }).join("");
            
            let bank = S.done ? "" : q.w.filter(w => !S.pl.includes(w)).map(w => '<span class="tl' + (S.sel == w ? " sel" : "") + '" draggable="true" ondragstart="event.dataTransfer.setData(\'text\',\'' + w + '\')" onclick="sw(\'' + w + '\')">' + w + '</span>').join("");
            
            let fb = "";
            if (S.done) {
                let c = S.pl.filter((w, k) => w == q.a[k]).length;
                fb = '<div class="fb">' + c + '/4 ✅</div>' + (c < 4 ? '<div class="fb" dir="ltr">' + q.a.map((w, k) => (k + 1) + "." + w).join("  ") + '</div>' : '') + '<button style="margin-top:10px;" onclick="nxt()">السؤال التالي ➡️</button>';
            } else {
                fb = '<button onclick="chkFi()">تأكيد ✔️</button>';
            }
            
            $.innerHTML = head() + '<div class="card"><p class="s">اضغط على الكلمة ثم اضغط مكانها في القطعة (أو اسحبها)</p><div class="pool" style="justify-content:center">' + bank + '</div><div class="pas">' + tx + '</div>' + fb + '</div>';
        }

        function sw(w) { S.sel = S.sel == w ? null : w; showFi(); }
        function put(k, w) { S.pl = S.pl.map(x => x == w ? null : x); S.pl[k] = w; S.sel = null; showFi(); }
        function bl(k) { if (S.done) return; if (S.sel) put(k, S.sel); else { S.pl[k] = null; showFi(); } }
        function drp(e, k) { e.preventDefault(); if (!S.done) put(k, e.dataTransfer.getData('text')); }

        function chkFi() {
            if (S.done) return;
            let q = S.qs[S.n];
            S.sc += S.pl.filter((w, k) => w == q.a[k]).length;
            S.done = true;
            showFi();
        }

        function fin(ok, ans) {
            if (S.done) return;
            S.done = true;
            if (ok) S.sc++;
            let msg = ok ? '<span style="color:var(--ok)">✅ بطل ممتاز! إجابة صحيحة</span>' : '<span style="color:var(--no)">❌ خطأ — الإجابة: <b dir="ltr">' + ans + '</b></span>';
            document.getElementById("fb").innerHTML = msg + '<button style="margin-top:10px;" onclick="nxt()">السؤال التالي ➡️</button>';
        }

        function pick(i) {
            if (S.done) return;
            let q = S.qs[S.n];
            let btns = document.querySelectorAll(".o");
            for (let j = 0; j < btns.length; j++) {
                if (j == q.a) btns[j].classList.add("ok");
                else if (j == i) btns[j].classList.add("no");
            }
            fin(i == q.a, q.o[q.a]);
        }

        function chk() {
            if (S.done) return;
            let q = S.qs[S.n], v = document.getElementById("in");
            let ok = q.a.split("|").some(x => norm(x) == norm(v.value));
            v.style.borderColor = ok ? "var(--ok)" : "var(--no)";
            v.disabled = true;
            fin(ok, q.a.split("|")[0]);
        }

        function nxt() {
            S.done = false; S.pl = null; S.n++;
            if (S.n < S.qs.length) show();
            else end();
        }

        function end() {
            let pc = Math.round(S.sc / (S.max || S.qs.length) * 100);
            let tpNames = { mc: "Word Challenges", gr: "Rewrite Challenges", fi: "Complete the Text" };
            let tp = tpNames[S.t] + " - Group " + (S.i + 1);
            let msg = pc >= 90 ? "أنت بطل خارق! 🏆" : pc >= 60 ? "ممتاز جداً! 👏" : "حاول مرة أخرى، يمكنك الإبضاع! 📚";
            let waText = "Prep 2 - Units 1 to 3 Review\nName: " + NAME + "\nTopic: " + tp + "\nScore: " + S.sc + "/" + (S.max || S.qs.length) + " (" + pc + "%)";
            let wa = "https://wa.me/201277924562?text=" + encodeURIComponent(waText);
            
            $.innerHTML = 
                '<div class="card gold">' +
                    '<div class="sc">' + S.sc + '/' + (S.max || S.qs.length) + '</div>' +
                    '<h3 style="font-size:20px; color:#d97706;">' + pc + '% — ' + msg + '</h3>' +
                    '<p class="s">' + NAME + '<br>' + tp + '</p>' +
                '</div>' +
                '<a class="wa" href="' + wa + '" target="_blank" rel="noopener">📲 مشاركة النتيجة عبر واتساب</a>' +
                '<button onclick="start(\'' + S.t + '\', ' + S.i + ')">🔁 حاول مرة أخرى</button>' +
                '<button class="link" onclick="home()">اختر موضوعاً آخر</button>';
        }

        welcome();
    </script>
</body>
</html>
